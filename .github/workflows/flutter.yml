name: Flutter CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    env:
      MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
      - name: Pub get
        run: flutter pub get
      - name: Analyze & test
        run: |
          flutter analyze --fatal-warnings
          flutter test --coverage